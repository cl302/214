<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart - FlyDreamAir</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h2>Your Cart</h2>
<ul id="cart-items">
</ul>

<form action="/payment/view" method="GET">
    <button type="submit">Proceed to Payment</button>
</form>

<br>
<form action="/dashboard" method="GET">
    <button type="submit">Back to Dashboard</button>
</form>

<script>
fetch('/cart/cart-items')
  .then(response => response.json())
  .then(items => {
    const list = document.getElementById('cart-items');
    list.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    });
  });
</script>
</body>
</html>
